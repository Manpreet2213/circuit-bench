<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Circuit Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a workbench — parts bin, live board, inspector. Board fills the screen; inspector becomes a bottom sheet on phones. */
:root{
  --bg:#E4E9EC; --panel:#F6F8F9; --ink:#17212A; --muted:#55646F; --line:#C0CBD2;
  --board:#EEF2EF; --grid:#BFCAC5; --sym:#FBFCFA; --accent:#B07002; --accent-ink:#1C1404;
  --ok:#2B7A4B; --bad:#B3261E; --wire-edge:#1B242B; --glow:#FFB938;
  --meter:#262E34; --meter-ink:#E6ECEF; --meter-edge:#D9981F; --lcd-bg:#B7C4A0; --lcd-fg:#1A2414;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-lcd:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1013; --panel:#141A1E; --ink:#DCE3E7; --muted:#8C99A3; --line:#2A343B;
  --board:#10171B; --grid:#27343C; --sym:#1A2227; --accent:#F0B03A; --accent-ink:#1C1404;
  --ok:#5CC98A; --bad:#F2766B; --wire-edge:#A3AFB7; --glow:#FFC24D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1013; --panel:#141A1E; --ink:#DCE3E7; --muted:#8C99A3; --line:#2A343B;
  --board:#10171B; --grid:#27343C; --sym:#1A2227; --accent:#F0B03A; --accent-ink:#1C1404;
  --ok:#5CC98A; --bad:#F2766B; --wire-edge:#A3AFB7; --glow:#FFC24D; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}

.app{height:100%;display:grid;gap:8px;position:relative;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "stage" "pal" "tools"}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1 1 auto;min-width:0}
.brand h1{font-size:1.4rem;line-height:1}
.brand .sub{font-size:.8rem;color:var(--muted);white-space:nowrap}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hb{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-weight:600;font-size:.88rem;min-height:34px;display:inline-flex;align-items:center;gap:5px}
.hb svg{width:17px;height:17px;flex:none}
.hb.icon{padding:5px 8px}
.hb[disabled]{opacity:.4;cursor:default}
.hb.pwr[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.hb.pwr[aria-pressed="false"]{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.hb.mob{display:inline-flex}

.stage{grid-area:stage;position:relative;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--board)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 130px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:.8rem;color:var(--muted);pointer-events:none;opacity:.94}
.banner{position:absolute;left:8px;right:8px;top:8px;background:var(--bad);color:var(--panel);font-weight:600;font-size:.86rem;border-radius:8px;padding:6px 10px;pointer-events:none;font-variant-numeric:tabular-nums}
.banner b{font-family:var(--f-display);letter-spacing:.08em;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.banner{animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{from{opacity:1}to{opacity:.78}}}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.zoom button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;min-width:34px;height:34px;font-weight:700;font-family:var(--f-display);font-size:1rem}
.toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:8px;padding:7px 12px;font-size:.86rem;max-width:min(92%,460px);pointer-events:none;text-align:center}

/* meter */
.meter{position:absolute;right:8px;top:8px;width:218px;max-width:calc(100% - 16px);background:var(--meter);color:var(--meter-ink);border:3px solid var(--meter-edge);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 16px rgb(0 0 0 / .2);z-index:5}
.stage.alarm .meter{top:46px}
.sheetbar{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:4px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;z-index:4}
.sheetbar span{font-family:var(--f-display);font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 4px}
.sheetbar button{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;width:30px;height:30px;font-weight:700;flex:none}
.stage.hassheet .banner{top:50px}
.sheetbar .b3d{width:auto;padding:0 9px;font-family:var(--f-display);border-color:var(--accent);color:var(--ink)}
.v3d{position:absolute;inset:0;z-index:20;background:#0D1418}
.v3d canvas{display:block;width:100%;height:100%;touch-action:none}
.v3top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center}
.v3t{flex:1;min-width:0;display:flex;flex-direction:column;color:#E6ECEF;line-height:1.15}
.v3t b{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3t span{font-size:.72rem;color:#9AA7B0}
.v3b{border:1.5px solid #3A4650;background:#18222A;color:#E6ECEF;border-radius:8px;padding:5px 10px;font-weight:600;font-size:.82rem;min-height:32px}
.v3b[aria-pressed="false"]{opacity:.55}
.v3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.v3labels span{position:absolute;transform:translate(-50%,-140%);font-family:var(--f-display);font-weight:700;font-size:.72rem;color:#E6ECEF;background:rgba(13,20,24,.72);border-radius:4px;padding:0 4px;white-space:nowrap}
.v3labels span.hot{color:#FFD45C}
.v3info{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(24,34,42,.92);border:1px solid #3A4650;color:#E6ECEF;border-radius:10px;padding:8px 10px;font-size:.84rem;max-height:40%;overflow:auto}
.v3info b{font-family:var(--f-display);font-size:1rem}
.v3info .lo{color:#9AA7B0;font-size:.78rem}
.stage.hassheet .meter{top:50px}
.stage.hassheet.alarm .meter{top:88px}
.stage:has(.meter:not([hidden])) .sheetbar{max-width:calc(100% - 250px)}
.mrow{display:flex;gap:6px;align-items:center}
.mseg{display:flex;flex:1;border:1.5px solid #59656D;border-radius:7px;overflow:hidden}
.mseg button{flex:1;border:0;background:#1A2024;color:var(--meter-ink);font-family:var(--f-display);font-weight:700;font-size:.92rem;padding:4px 0}
.mseg button[aria-pressed="true"]{background:var(--meter-edge);color:#1C1404}
.mx{border:1.5px solid #59656D;background:#1A2024;color:var(--meter-ink);border-radius:7px;width:30px;height:30px;font-weight:700}
.lcd{background:var(--lcd-bg);color:var(--lcd-fg);border-radius:6px;padding:2px 10px;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;font-family:var(--f-lcd);box-shadow:inset 0 2px 4px rgb(0 0 0 / .25)}
.lcd .val{font-size:2.1rem;line-height:1.15;font-variant-numeric:tabular-nums}
.lcd .unit{font-size:1.05rem}
.mnote{margin:0;font-size:.76rem;color:#B4BEC5}
.mclip{align-self:flex-start;border:1.5px solid #59656D;background:#1A2024;color:var(--meter-ink);border-radius:7px;padding:3px 9px;font-size:.78rem;font-weight:600}
.mseg button{font-size:.86rem}
.complaint{margin:0;font-size:1.08rem;font-weight:600;line-height:1.35;max-width:60ch}
.status.warn{border-left-color:var(--accent);color:var(--ink)}
.result{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px 12px}
.result .big{font-family:var(--f-display);font-size:1.7rem;color:var(--accent);line-height:1}
.result p{margin:0;font-size:.9rem;max-width:60ch}
.stars{color:var(--accent);font-size:1.1rem;letter-spacing:.1em}
.jobcta{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px 12px}
.jobcta p{margin:0;font-size:.86rem;color:var(--muted)}
.tasks{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px;font-size:.9rem}.tasks li.ok::marker{color:var(--ok)}.tasks .lok{color:var(--muted);font-size:.84rem}
.tasks li{display:flex;flex-direction:column;gap:2px}.tasks .rd{font-family:var(--f-lcd);font-size:.82rem;color:var(--ink)}
.phead .cust{margin:2px 0 0;font-size:.98rem;line-height:1.35}
body.joblock .palette{opacity:.4;pointer-events:none}
body.joblock [data-tool="wire"],body.joblock [data-tool="delete"]{opacity:.35}
.chip[disabled]{opacity:.4}

/* tools */
.tools{grid-area:tools;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.86rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:36px}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.wopts{display:flex;gap:6px;align-items:center}
.wopts select{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px;font-size:.86rem}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;min-height:34px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.views{display:flex;gap:6px;margin-left:auto}

/* palette */
.palette{grid-area:pal;display:flex;gap:10px;overflow-x:auto;touch-action:pan-x;padding-bottom:2px;scrollbar-width:thin}
.pgrp{display:flex;gap:6px;align-items:stretch}
.pcat{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.pitems{display:flex;gap:6px}
.pi{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 6px 5px;min-width:76px;font-size:.76rem;font-weight:600;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.pi canvas{width:60px;height:34px;pointer-events:none}
.pi span{white-space:nowrap}
.pi[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1.5px solid var(--accent);border-radius:8px;padding:3px 8px;font-size:.8rem;font-weight:600;transform:translate(-50%,-140%)}

/* panel */
.panel{display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;overflow:hidden;
  position:absolute;left:0;right:0;bottom:calc(var(--tools-h,44px) + 8px);max-height:56%;z-index:30;box-shadow:0 -8px 28px rgb(0 0 0 / .2)}
.panel.open{display:flex}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.phead .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.phead .tag{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--muted)}
.phead h2{font-size:1.2rem}
.lab{font-family:var(--f-display);font-weight:700;font-size:1.25rem;border:0;border-bottom:1.5px dashed var(--line);background:transparent;padding:0;width:100%;max-width:14ch}
.livesum{font-family:var(--f-lcd);font-size:.85rem;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;width:34px;height:34px;font-weight:700;flex:none}
.pbody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.panel.min .pbody{display:none}
.panel.min .pmin svg{transform:rotate(180deg)}
.status{margin:0;border-radius:8px;padding:7px 10px;font-weight:600;font-size:.88rem;background:var(--bg);border-left:4px solid var(--bad);color:var(--bad)}
.live{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.88rem}
.live dt{color:var(--muted)}
.live dd{margin:0;text-align:right;font-family:var(--f-lcd);font-variant-numeric:tabular-nums}
.heat{display:inline-block;width:90px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;vertical-align:middle}
.heat i{display:block;height:100%;background:var(--bad)}
.fields{display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.f > span:first-child{font-weight:600}
.f select,.f input[type=number]{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:.95rem;color:var(--ink);width:100%;min-width:0}
.inrow{display:flex;gap:6px;align-items:center}
.inrow em{font-style:normal;color:var(--ink);font-weight:600;min-width:1.5em}
.f .seg{align-self:flex-start;background:var(--bg)}
.f .seg button{color:var(--ink)}
.f .seg button[aria-pressed="true"]{color:var(--panel)}
.f input[type=range]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--wire-edge)}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.note{margin:0;font-size:.86rem;color:var(--muted);max-width:60ch}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.hold{border-color:var(--accent);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.btn.hold:active{background:var(--accent);color:var(--accent-ink)}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.loglist li{font-size:.86rem;border-left:3px solid var(--line);padding:2px 0 2px 8px}
.loglist li.bad{border-left-color:var(--bad)}
.loglist li.warn{border-left-color:var(--accent)}
.loglist li.ok{border-left-color:var(--ok)}
.loglist time{display:block;font-family:var(--f-lcd);font-size:.72rem;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{font-size:1rem;text-transform:uppercase;letter-spacing:.07em}
.howto{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:.86rem;max-width:60ch}
.exlist{display:flex;flex-direction:column;gap:6px}
.exb{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.exb b{font-family:var(--f-display);font-size:1.05rem}
.exb span{font-size:.82rem;color:var(--muted)}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-family:var(--f-lcd);font-size:.75rem;resize:vertical}

@media (max-width:520px){
  .brand .sub{display:none}
  .brand h1{font-size:1.2rem}
  .hb{padding:4px 7px;min-height:32px;font-size:.84rem}
  .pwr .pl{display:none}
  .hbtns{gap:4px}
  .seg button .tl{display:none}
  .seg button{padding:6px 9px}
  .chip{padding:5px 9px}
  .views{gap:4px}
  .hint{font-size:.74rem;max-width:calc(100% - 128px)}
}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top top top" "pal stage panel" "pal tools panel"}
  .hb.mob{display:none}
  .palette{flex-direction:column;overflow-x:hidden;overflow-y:auto;touch-action:auto;gap:12px;padding-right:2px}
  .pgrp{flex-direction:column;gap:6px}
  .pcat{writing-mode:horizontal-tb;transform:none;text-align:left}
  .pitems{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pi{min-width:0;touch-action:none}
  .panel{display:flex;position:static;max-height:none;box-shadow:none;grid-area:panel}
  .panel.min .pbody{display:flex}
  .pmin,.pclose.mobonly{display:none}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Circuit Bay</h1><span class="sub">12 / 24 V wiring bench</span></div>
    <div class="hbtns">
      <button class="hb" id="bFile" type="button">Circuits</button>
      <button class="hb icon" id="bUndo" type="button" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="hb icon" id="bRedo" type="button" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="hb pwr" id="bPower" type="button" aria-pressed="true" title="Battery disconnect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg><span><span class="pl">Power </span><span id="pwrTxt">on</span></span></button>
      <button class="hb" id="bRepair" type="button" title="Replace every blown fuse and burnt part">Repair</button>
      <button class="hb mob icon" id="bLog" type="button" aria-label="Event log" title="Event log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button class="hb icon" id="bSound" type="button" aria-pressed="true" aria-label="Sound on" title="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="sndWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    </div>
  </header>

  <nav class="palette" id="palette" aria-label="Parts bin"></nav>

  <main class="stage" id="stage">
    <canvas id="board" aria-label="Circuit board"></canvas>
    <div class="sheetbar" id="sheetbar" hidden><button type="button" id="shPrev" aria-label="Previous sheet">‹</button><span id="shName"></span><button type="button" id="shNext" aria-label="Next sheet">›</button><button type="button" id="sh3d" class="b3d">3D</button></div>
    <div class="banner" id="banner" hidden></div>
    <div class="meter" id="meter" hidden>
      <div class="mrow">
        <div class="mseg" role="group" aria-label="Meter mode">
          <button type="button" data-mm="V" aria-pressed="true">DC V</button>
          <button type="button" data-mm="R" aria-pressed="false">Ω</button>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#board'), cx=cv.getContext('2d'), stage=$('#stage'), panel=$('#panel');
const GRID=24, CELL_M=0.1, OFF=1e-9, G_ON=1000;
const isDesk=()=>matchMedia('(min-width:900px)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- reference data ---------- */
const GAUGES=['22','20','18','16','14','12','10','8','6','4','2','1/0','2/0'];
const AWG={'22':{amp:5,r:0.053},'20':{amp:7.5,r:0.0333},'18':{amp:10,r:0.021},'16':{amp:13,r:0.0132},'14':{amp:17,r:0.0083},'12':{amp:23,r:0.0052},'10':{amp:33,r:0.0033},'8':{amp:46,r:0.0021},'6':{amp:60,r:0.0013},'4':{amp:100,r:0.00083},'2':{amp:130,r:0.00052},'1/0':{amp:200,r:0.00033},'2/0':{amp:250,r:0.00026}};
const WCOL={red:'#C9302C',black:'#252A2E',white:'#EFEFE8',green:'#2E8B57',yellow:'#DDAE1F',blue:'#2F68C4',brown:'#8A5A2E',orange:'#E07B22',purple:'#7E4FB8',gray:'#8C949A'};
const LEDC={red:{n:'Red',vf:2.0,col:'#FF3B30'},amber:{n:'Amber',vf:2.1,col:'#FFA41B'},green:{n:'Green',vf:2.2,col:'#2BD66B'},blue:{n:'Blue',vf:3.0,col:'#3D8BFF'},white:{n:'White',vf:3.1,col:'#F2F6FF'}};
const MOTORS={fan:{n:'Cooling fan (≈8 A)',r:1.5},wiper:{n:'Wiper motor (≈5 A)',r:2.4},pump:{n:'Fuel pump (≈6 A)',r:2},blower:{n:'Blower (≈13 A)',r:0.9},starter:{n:'Starter (≈200 A)',r:0.05},custom:{n:'Custom resistance'}};
const T2=[['in',-2,0],['out',2,0]];
const vv=(V,i)=>i<0?0:(V[i]||0);

const T={
 battery:{name:'Battery',pre:'BAT',terms:[['+',-2,0],['-',2,0]],box:[-2,-1.15,2,1.15],def:{v:12.6,ri:0.01},
   els:(p,n,rt,o)=>o.power?[{a:n[0],b:n[1],g:1/Math.max(1e-4,p.ri*(rt.chg?6:1)),e:p.v,k:'m'}]:[],val:p=>(+p.v).toFixed(1)+' V',
   note:'A healthy 12 V battery rests near 12.6 V. Low internal resistance is what makes cranking amps — and what makes a short so violent.'},
 ground:{name:'Ground',pre:'GND',terms:[['G',0,0]],box:[-0.8,-0.3,0.8,1.3],def:{},
   els:(p,n)=>[{a:n[0],b:-1,g:1e4,k:'m'}],note:'Every ground symbol is the same chassis node. Current still has to get back to battery negative, so wire the battery − to a ground too.'},
 fuse:{name:'Fuse',pre:'F',terms:T2,box:[-2,-0.75,2,0.7],def:{a:15,blown:false},
   els:p=>[],val:p=>p.a+' A',note:'Size the fuse to protect the wire, not the load. A fuse that is bigger than the wire can carry turns the wire into the fuse.'},
 breaker:{name:'Circuit breaker',pre:'CB',terms:T2,box:[-2,-0.95,2,0.6],def:{a:20,tripped:false},
   els:p=>[],val:p=>p.a+' A',note:'Trips like a fuse but resets. Tap it on the board to reset it after a trip.'},
 switch:{name:'Toggle switch',pre:'S',terms:T2,box:[-2,-0.95,2,0.5],def:{on:false,rate:20},
   els:p=>[],note:'Tap it on the board to flip it.'},
 button:{name:'Push button',pre:'PB',terms:T2,box:[-2,-1.05,2,0.5],def:{rate:10},
   els:p=>[],note:'Momentary: closed only while you hold it down on the board.'},
 spdt:{name:'SPDT switch',pre:'S',terms:[['C',-2,0],['A',2,-1],['B',2,1]],box:[-2,-1.5,2,1.5],def:{pos:'A'},
   els:p=>[],note:'Common C goes to either A or B, like a high/low beam switch. Tap it on the board to flip.'},
 key:{name:'Ignition switch',pre:'KEY',terms:[['BATT',-2,0],['ACC',2,-1],['IGN',2,0],['ST',2,1]],box:[-2,-1.75,2,1.75],def:{pos:'OFF'},
   els:p=>[],val:p=>p.pos,note:'Tap to go OFF → ACC → ON. At ON, press and hold the key to crank (START). ACC drops out while cranking, like a real truck.'},
 relay:{name:'Relay',pre:'K',terms:p=>p.pins==4?[['86',-2,-1],['85',-2,1],['30',2,0],['87',2,1]]:[['86',-2,-1],['85',-2,1],['30',2,0],['87',2,1],['87a',2,-1]],
   box:[-2,-1.95,2,1.95],def:{pins:5,coil:12,rate:30},els:p=>[],val:p=>p.coil+' V',
   note:'85/86 is the coil. 30 is common, 87 is normally open, 87a normally closed. It pulls in above about 60% of coil voltage and drops out below 30%.'},
 lamp:{name:'Lamp',pre:'L',terms:T2,box:[-2,-1,2,1],def:{w:55,vr:12},els:p=>[],val:p=>p.w+' W',
   note:'A lamp’s resistance comes from its rating: R = V² ÷ W. A 12 V bulb on 24 V draws four times its power.'},
 led:{name:'LED',pre:'LED',terms:T2,box:[-2,-1.05,2,0.75],def:{color:'red'},els:p=>[],
   note:'LEDs need a series resistor — about 470 Ω on 12 V. Current only flows anode (in) to cathode (out).'},
 diode:{name:'Diode',pre:'D',terms:T2,box:[-2,-0.75,2,0.75],def:{},els:p=>[],
   note:'Passes current from in to out only, dropping about 0.7 V. Rated 3 A here.'},
 motor:{name:'Motor',pre:'M',terms:T2,box:[-2,-1.05,2,1.05],def:{kind:'fan',rw:1.5},els:p=>[],
   note:'Modelled as a fixed resistance. Starters pull 150–250 A, which is why they get heavy cable and a relay or solenoid.'},
 horn:{name:'Horn',pre:'HN',terms:T2,box:[-2,-1.05,2,1.05],def:{a:5,vr:12},els:p=>[],
   note:'Truck horns pull 4–10 A each, which is why they sit behind a relay and a small horn button.'},
 resistor:{name:'Resistor',pre:'R',terms:T2,box:[-2,-0.75,2,0.6],def:{ohm:470,watt:0.5},els:p=>[],val:p=>fR(p.ohm),
   note:'Watch the wattage: P = I² × R. A part that is too small for the power will smoke and go open.'},
 rheo:{name:'Rheostat',pre:'RH',terms:T2,box:[-2,-0.95,2,0.95],def:{max:20,pct:50},els:p=>[],val:p=>fR(rheoR(p)),
   note:'Slide it to change resistance live, like a dash dimmer. Rated 25 W.'},
 ammeter:{name:'Ammeter',pre:'AM',terms:T2,box:[-2,-1.05,2,1],def:{},els:p=>[],
   note:'Goes in series with the circuit. Its amp jack is fused at 10 A like a real meter, so use the clamp for big loads.'},
 solenoid:{name:'Solenoid',pre:'Y',terms:T2,box:[-2,-1.25,2,1],def:{rw:4,vr:12},els:p=>[],note:'A coil that pulls a steel plunger: starter solenoid, fan clutch, PTO and ABS valves. Electrically it is a resistance that clicks in once enough current flows.'},
 heater:{name:'Heater element',pre:'HT',terms:T2,box:[-2,-0.9,2,0.9],def:{w:150,vr:12},els:p=>[],val:p=>p.w+' W',note:'A plain resistive load like the fuel filter, air dryer, urea line or mirror heaters. Heaters pull steady current, so they stand out in a parasitic draw test.'},
 ecu:{name:'ECU / module',pre:'ECU',terms:[['PWR',-3,-2],['IN',-3,0],['GND',-3,2],['OUT',3,-2],['REF',3,0],['SIG',3,2]],box:[-3,-3.1,3,3.1],def:{logic:'low',side:'high',pull:'up',orate:10},els:p=>[],
   note:'A simplified control module. It wakes up with power and ground (over 9 V). IN is a switch input with a pull-up or pull-down, OUT is a protected driver that shuts itself off on a short, REF is the 5 V sensor supply and SIG reads a sensor like a scan tool would.'},
 ntc:{name:'Temp sensor (NTC)',pre:'B',terms:T2,box:[-2,-0.9,2,0.9],def:{tc:20},els:p=>[],val:p=>p.tc+' °C',note:'Resistance drops as it heats up: about 2.5 kΩ cold and about 250 Ω hot. The module feeds it 5 V through an internal resistor and reads the voltage left over.'},
 pedal:{name:'Pedal sensor',pre:'B',terms:[['5V',-2,-1],['SIG',2,0],['GND',-2,1]],box:[-2,-1.6,2,1.6],def:{pos:15},els:p=>[],val:p=>p.pos+'%',note:'A 3-wire potentiometer: 5 V reference, signal and ground. Signal follows pedal position, about 0.5 V released and 4.5 V floored.'},
 pswitch:{name:'Pressure / door switch',pre:'SW',terms:T2,box:[-2,-1.1,2,0.75],def:{kind:'pressure',nc:false,act:false},els:p=>[],note:'Switches the truck works for you: brake light pressure, oil pressure, park brake, door jamb. Tap it on the board to apply pressure or open the door.'},
 conn:{name:'Connector (2-pin)',pre:'X',terms:[['1',-2,-1],['1′',2,-1],['2',-2,1],['2′',2,1]],box:[-2,-1.6,2,1.6],def:{f1:'ok',f2:'ok'},els:p=>[],note:'Most electrical faults live in connectors. Set a pin to open, corroded or wet and compare readings on each side of it.'},
 alt:{name:'Alternator',pre:'GEN',terms:[['GND',-2,0],['B+',2,-1],['IGN',2,1]],box:[-2,-1.8,2,1.8],def:{v:14.2,amax:130,run:false},els:p=>[],note:'Charges at about 14.2 V once the engine runs and IGN excites the field. Tap it on the board to start or stop the engine. Output is current-limited.'},
 cpin:{name:'Connector / splice',pre:'X',terms:T2,box:[-2,-0.6,2,0.6],def:{kind:'pin'},els:p=>[],note:'One pin of a connector, a splice or a ground stud. On a real truck this is where corrosion, pushed-out pins and loose studs cause most faults.'},
 drv:{name:'Module output',pre:'Q',terms:T2,box:[-2,-0.9,2,0.9],def:{on:true},els:p=>[],note:'A driver inside a control module that switches a circuit on command. Tap it to turn the output on or off, like an output test with a scan tool.'},
 rcoil:{name:'Relay coil',pre:'K',terms:T2,box:[-2,-0.85,2,0.85],def:{rid:''},els:p=>[],note:'The 85–86 coil of a relay, drawn on its own like the Volvo sheets do. It pulls in above about 7 V and drops out below 4 V. Its contacts are the part with the same name.'},
 rcont:{name:'Relay contacts',pre:'K',terms:T2,box:[-2,-0.95,2,0.85],def:{rid:'',nc:false},els:p=>[],note:'The 30–87 (or 30–87a) contacts of a relay. They move when the coil with the same name pulls in.'},
 mod:{name:'Module',pre:'A',terms:T2,box:[-2,-0.85,2,0.85],def:{ohms:12,kind:'load'},els:p=>[],note:'A control module shown as the load it puts on its supply, or as the input resistance a sensor or switch sees.'},
 canterm:{name:'CAN terminator',pre:'RT',terms:T2,box:[-2,-0.75,2,0.75],def:{ohm:120},els:p=>[],note:'Each end of a CAN bus has a 120 Ω resistor. With power off, CAN-H to CAN-L reads about 60 Ω (two in parallel). 120 Ω means one is missing; OL means both.'}
};
const fuseR=a=>0.08/a, rheoR=p=>Math.max(0.05,p.max*p.pct/100);
const coilR=p=>p.coil*p.coil/1.8;
const lampR=p=>p.vr*p.vr/p.w;
T.fuse.els=(p,n)=>[{a:n[0],b:n[1],g:p.tlf?1/6.8:(p.blown||p.pulled)?OFF:1/fuseR(p.a),k:'m'}];
T.breaker.els=(p,n)=>[{a:n[0],b:n[1],g:p.tlf?1/6.8:p.tripped?OFF:1/(0.06/p.a),k:'m'}];
T.switch.els=(p,n)=>[{a:n[0],b:n[1],g:p.on&&!p.dmg?G_ON:OFF,k:'m'}];
T.button.els=(p,n,rt)=>[{a:n[0],b:n[1],g:rt.pressed&&!p.dmg?G_ON:OFF,k:'m'}];
T.spdt.els=(p,n)=>[{a:n[0],b:n[1],g:p.pos==='A'?G_ON:OFF,k:'a'},{a:n[0],b:n[2],g:p.pos==='B'?G_ON:OFF,k:'b'}];
T.key.els=(p,n)=>{const q=p.pos,on=x=>x?G_ON:OFF;return[
  {a:n[0],b:n[1],g:on(q==='ACC'||q==='ON'),k:'acc'},{a:n[0],b:n[2],g:on(q==='ON'||q==='START'),k:'ign'},{a:n[0],b:n[3],g:on(q==='START'),k:'st'}];};
T.relay.els=(p,n,rt)=>{const r=[{a:n[0],b:n[1],g:1/coilR(p),k:'coil'},{a:n[2],b:n[3],g:rt.en&&!p.dmg?500:OFF,k:'c87'}];
  if(p.pins!=4) r.push({a:n[2],b:n[4],g:!rt.en&&!p.dmg?500:OFF,k:'c87a'});return r;};
T.relay.nl=(p,n,rt,V)=>{if(p.hf&&p.hf.k==='coil'){if(rt.en){rt.en=false;return true;}return false;}const vc=Math.abs(vv(V,n[0])-vv(V,n[1]));
  if(!rt.en&&vc>0.6*p.coil){rt.en=true;return true;} if(rt.en&&vc<0.3*p.coil){rt.en=false;return true;} return false;};
T.lamp.els=(p,n)=>[{a:n[0],b:n[1],g:p.dmg?OFF:1/lampR(p),k:'m'}];
const diodeNl=vf=>(p,n,rt,V)=>{if(p.dmg)return false;const f=typeof vf==='function'?vf(p):vf,vd=vv(V,n[0])-vv(V,n[1]);
  if(rt.on){if(vd<f-1e-7){rt.on=false;return true;}}else if(vd>f+1e-7){rt.on=true;return true;}return false;};
T.led.els=(p,n,rt)=>[p.dmg||!rt.on?{a:n[0],b:n[1],g:OFF,k:'m'}:{a:n[0],b:n[1],g:1/15,e:LEDC[p.color].vf,k:'m'}];
T.led.nl=diodeNl(p=>LEDC[p.color].vf);
T.diode.els=(p,n,rt)=>[p.dmg||!rt.on?{a:n[0],b:n[1],g:OFF,k:'m'}:{a:n[0],b:n[1],g:1/0.02,e:0.7,k:'m'}];
T.diode.nl=diodeNl(0.7);
T.motor.els=(p,n)=>[{a:n[0],b:n[1],g:1/Math.max(0.01,p.rw),k:'m'}];
T.horn.els=(p,n)=>[{a:n[0],b:n[1],g:p.a/p.vr,k:'m'}];
T.resistor.els=(p,n)=>[{a:n[0],b:n[1],g:p.dmg?OFF:1/Math.max(0.01,p.ohm),k:'m'}];
T.rheo.els=(p,n)=>[{a:n[0],b:n[1],g:p.dmg?OFF:1/rheoR(p),k:'m'}];
T.ammeter.els=(p,n)=>[{a:n[0],b:n[1],g:p.dmg?OFF:1000,k:'m'}];
T.battery.nl=(p,n,rt,V)=>{const g=1/Math.max(1e-4,p.ri*(rt.chg?6:1)),I=g*(vv(V,n[0])-vv(V,n[1])-p.v);if(!rt.chg&&I>0.5){rt.chg=true;return true;}if(rt.chg&&I<0.05){rt.chg=false;return true;}return false;};
T.solenoid.els=(p,n)=>[{a:n[0],b:n[1],g:1/Math.max(0.05,p.rw),k:'m'}];
T.heater.els=(p,n)=>[{a:n[0],b:n[1],g:p.w/(p.vr*p.vr),k:'m'}];
const ntcR=p=>2500*Math.exp(3600*(1/(p.tc+273.15)-1/293.15));
function ecuTemp(v){if(v>4.9)return '−40 °C · circuit high';if(v<0.08)return '150 °C · circuit low';const R=2200*v/(5-v),Tc=1/(1/293.15+Math.log(R/2500)/3600)-273.15;return Math.round(clamp(Tc,-40,150))+' °C';}
T.ntc.els=(p,n)=>[{a:n[0],b:n[1],g:1/ntcR(p),k:'m'}];
T.pedal.els=(p,n)=>{const f=clamp(p.pos/100,0,1),Rt=5000;return[{a:n[0],b:n[1],g:1/Math.max(5,Rt*(0.9-0.8*f)),k:'top'},{a:n[1],b:n[2],g:1/Math.max(5,Rt*(0.1+0.8*f)),k:'bot'}];};
const psClosed=p=>p.nc?!p.act:p.act;
T.pswitch.els=(p,n)=>[{a:n[0],b:n[1],g:psClosed(p)&&!p.dmg?G_ON:OFF,k:'m'}];
const pinG=f=>f==='open'?OFF:f==='corroded'?1/5:500;
T.conn.els=(p,n)=>{if(p.unplug)return[{a:n[0],b:n[1],g:OFF,k:'p1'},{a:n[2],b:n[3],g:OFF,k:'p2'}];const r=[{a:n[0],b:n[1],g:pinG(p.f1),k:'p1'},{a:n[2],b:n[3],g:pinG(p.f2),k:'p2'}];if(p.f1==='wet'||p.f2==='wet')r.push({a:n[1],b:n[3],g:1/40,k:'leak'});return r;};
T.canterm.els=(p,n)=>[{a:n[0],b:n[1],g:1/Math.max(1,p.ohm),k:'m'}];
T.alt.els=(p,n,rt)=>{const r=[{a:n[2],b:n[0],g:1/40,k:'exc'}];if(p.run&&rt.exc&&!p.dmg)r.push(rt.cl?{a:n[1],b:n[0],g:1e-7,e:p.amax/1e-7,k:'out'}:{a:n[1],b:n[0],g:1/0.02,e:p.v,k:'out'});return r;};
T.alt.nl=(p,n,rt,V)=>{let ch=false;const vx=vv(V,n[2])-vv(V,n[0]);
  if(!rt.exc&&vx>8){rt.exc=true;ch=true;}else if(rt.exc&&vx<5){rt.exc=false;ch=true;}
  if(!p.run){if(rt.cl){rt.cl=false;ch=true;}return ch;}
  if(rt.exc){const vo=vv(V,n[1])-vv(V,n[0]);if(!rt.cl){if((p.v-vo)/0.02>p.amax*1.001){rt.cl=true;ch=true;}}else if(vo>p.v+0.001){rt.cl=false;ch=true;}}return ch;};
T.ecu.els=(p,n,rt)=>{const [PW,IN,GN,OUT,REF,SIG]=n;const r=[{a:PW,b:GN,g:1/60,k:'q'}];
  if(rt.awake){r.push(p.logic==='high'?{a:IN,b:GN,g:1e-4,k:'pin'}:{a:PW,b:IN,g:1e-4,k:'pin'});
    r.push({a:REF,b:GN,g:1/20,e:5,k:'ref'});
    r.push(p.pull==='up'?{a:SIG,b:GN,g:1/2200,e:5,k:'sig'}:{a:SIG,b:GN,g:1e-6,k:'sig'});
    const on=rt.act&&!rt.prot&&!p.dmg;r.push(p.side==='low'?{a:OUT,b:GN,g:on?20:OFF,k:'out'}:{a:PW,b:OUT,g:on?20:OFF,k:'out'});}
  else r.push({a:SIG,b:GN,g:1e-6,k:'sig'});
  return r;};
T.ecu.nl=(p,n,rt,V)=>{const [PW,IN,GN]=n;let ch=false;const vs=vv(V,PW)-vv(V,GN);

function rtFor(p,o){if(!o.tmp)return RT(p);let t=o.tmp.get(p.id);if(!t){t={on:false,en:false,pressed:RT(p).pressed};o.tmp.set(p.id,t);}return t;}
function gather(o){
  const els=[];
  for(const p of S.parts){const n=NN.get(p.id),L=T[p.t].els(p,n,rtFor(p,o),o);if(p.hf)applyHF(p,L);for(const e of L){e.own=p;if(e.e===undefined)e.e=0;els.push(e);}}

    const hf=w.hf,io=hf&&hf.k==='int'&&INT[w.id]&&INT[w.id].open;els.push({a:n[0],b:n[1],g:w.burnt||io||(hf&&hf.k==='open')?OFF:1/(Math.max(2e-5,R)+(hf&&hf.k==='hr'?hf.r:0)),e:0,k:'m',own:w});

    if(hf&&hf.k==='chafe')els.push({a:n[1],b:-1,g:1/Math.max(0.005,hf.r||0.05),e:0,k:'chafe',own:w});
    if(hf&&hf.k==='stp'){const bp=mainBat();if(bp){const bn=NN.get(bp.id);if(bn)els.push({a:bn[0],b:n[1],g:1/Math.max(0.01,hf.r||0.1),e:0,k:'stp',own:w});}}}

const INT={};
function mainBat(){return S.parts.find(p=>p.t==='battery'&&(p.label==='BAT'||p.label==='BAT1'))||S.parts.find(p=>p.t==='battery');}
function stepInt(dt){for(const o of [...S.parts,...S.wires]){if(!o.hf||o.hf.k!=='int')continue;const st=INT[o.id]||(INT[o.id]={open:false,t:2+Math.random()*3,force:0});
  if(st.force>0){st.force-=dt;st.open=true;if(st.force<=0){st.open=false;st.t=1.5+Math.random()*3;}continue;}
  st.t-=dt;if(st.t<=0){st.open=!st.open;st.t=st.open?0.25+Math.random()*0.9:2+Math.random()*5;}}}
function nlCheck(V,o){let ch=false;for(const p of S.parts){const f=T[p.t].nl;if(f&&f(p,NN.get(p.id),rtFor(p,o),V))ch=true;}return ch;}
function lin(els,n,inj){
  const A=new Float64Array(n*n),z=new Float64Array(n);
  for(let i=0;i<n;i++)A[i*n+i]=1e-9;
  for(const e of els){const a=e.a,b=e.b,g=e.g,ge=g*e.e;
    if(a===b)continue;if(a>=0){A[a*n+a]+=g;z[a]+=ge;} if(b>=0){A[b*n+b]+=g;z[b]-=ge;} if(a>=0&&b>=0){A[a*n+b]-=g;A[b*n+a]-=g;}}
  if(inj)for(const [i,c] of inj)if(i>=0)z[i]+=c;
  for(let c=0;c<n;c++){
    let pr=c,mx=Math.abs(A[c*n+c]);
    for(let r=c+1;r<n;r++){const v=Math.abs(A[r*n+c]);if(v>mx){mx=v;pr=r;}}
    if(mx<1e-30)continue;
    if(pr!==c){for(let k=c;k<n;k++){const t=A[c*n+k];A[c*n+k]=A[pr*n+k];A[pr*n+k]=t;}const t=z[c];z[c]=z[pr];z[pr]=t;}
    const d=A[c*n+c];
    for(let r=c+1;r<n;r++){const f=A[r*n+c]/d;if(f===0)continue;const ro=r*n,co=c*n;for(let k=c;k<n;k++)A[ro+k]-=f*A[co+k];z[r]-=f*z[c];}
  }

  for(let r=n-1;r>=0;r--){let s=z[r];for(let k=r+1;k<n;k++)s-=A[r*n+k]*x[k];const d=A[r*n+r];x[r]=Math.abs(d)<1e-30?0:s/d;}
  return x;
}
function buildNodes(){
  const idx=new Map();let n=0;
  const add=(x,y)=>{const k=x+','+y;let i=idx.get(k);if(i===undefined){i=n++;idx.set(k,i);}return i;};
  for(const p of S.parts)NN.set(p.id,termPts(p).map(t=>add(t.x,t.y)));
  for(const w of S.wires)NN.set(w.id,[add(w.x1,w.y1),add(w.x2,w.y2)]);
  return{idx,n};
}
function solve(){
  const {idx,n}=buildNodes();const o={power:S.power};let V=new Float64Array(n),els=[];
  for(let it=0;it<40;it++){els=gather(o);V=lin(els,n,null);if(!nlCheck(V,o))break;}
  sim={idx,V,n};
  for(const p of S.parts){const r=RT(p);for(const k in r)if(k[0]==='I')r[k]=0;}
  for(const w of S.wires)RT(w).I=0;
  for(const e of els){const I=e.g*(vv(V,e.a)-vv(V,e.b)-e.e),r=RT(e.own);
    if(e.k==='m')r.I=I;else if(e.k==='coil')r.Icoil=I;else if(e.k==='c87'||e.k==='c87a')r.Ic=Math.max(r.Ic,Math.abs(I));else r['I'+e.k]=I;}
  for(const p of S.parts){const nn=NN.get(p.id),r=RT(p);r.V=nn.length>1?vv(V,nn[0])-vv(V,nn[1]):vv(V,nn[0]);r.P=Math.abs(r.V*r.I);if(p.t==='ecu')r.sig=vv(V,nn[5])-vv(V,nn[2]);}
}
const ptV=pt=>{if(!pt)return 0;const i=sim.idx.get(pt.x+','+pt.y);return i===undefined?NaN:vv(sim.V,i);};
function ohmsBetween(a,b){
  const ia=sim.idx.get(a.x+','+a.y),ib=b?sim.idx.get(b.x+','+b.y):-1;
  if(ia===undefined||ib===undefined)return NaN;
  const o={power:false,tmp:new Map()};let V=null;
  for(let it=0;it<40;it++){const els=gather(o);V=lin(els,sim.n,[[ia,1e-3],[ib,-1e-3]]);if(!nlCheck(V,o))break;}
  return (vv(V,ia)-vv(V,ib))/1e-3;

/* ---------- heat, damage, events ---------- */
let worst=null;
const hb=(h,rate,dt)=>Math.max(0,(h||0)+rate*dt);
function heatTick(dt){
  worst=null;
  const mark=(obj,h,msg)=>{if(!worst||h>worst.h)worst={obj,h,msg};};
  const contact=(p,r,I,rate,what)=>{if(p.dmg)return;const q=I/rate;r.heat=hb(r.heat,q>1?(q*q-1)/8:-0.3,dt);
    if(q>1)mark(p,r.heat,`${p.label}: ${fA(I)} through ${rate} A contacts`);
    if(r.heat>=1){p.dmg=true;damage(p,`${what} ${p.label} contacts burned open — ${fA(I)} through ${rate} A contacts.`,'burn');}};
  for(const p of S.parts){const r=RT(p),I=Math.abs(r.I);
    switch(p.t){
      case 'fuse':if(p.blown||p.tlf||p.pulled)break;{const q=I/p.a;r.heat=hb(r.heat,q>1?(q*q-1)/3:-0.6,dt);
        if(q>1)mark(p,r.heat,`${p.label}: ${fA(I)} through a ${p.a} A fuse`);
        if(r.heat>=1){p.blown=true;damage(p,`Fuse ${p.label} blew — ${fA(I)} through a ${p.a} A fuse.`,'pop');}}break;
      case 'breaker':if(p.tripped||p.tlf)break;{const q=I/p.a;r.heat=hb(r.heat,q>1?(q*q-1)/5:-0.6,dt);
        if(q>1)mark(p,r.heat,`${p.label}: ${fA(I)} through a ${p.a} A breaker`);
        if(r.heat>=1){p.tripped=true;r.heat=0;damage(p,`Breaker ${p.label} tripped at ${fA(I)}. Tap it to reset once the fault is fixed.`,'click');}}break;
      case 'switch':contact(p,r,I,p.rate,'Switch');break;
      case 'button':contact(p,r,I,p.rate,'Button');break;
      case 'relay':contact(p,r,r.Ic,p.rate,'Relay');break;
      case 'ammeter':if(p.dmg)break;{const q=I/10;r.heat=hb(r.heat,q>1?(q*q-1)/0.5:-1,dt);
        if(q>1)mark(p,r.heat,`${p.label}: ${fA(I)} through a 10 A meter`);
        if(r.heat>=1){p.dmg=true;damage(p,`Ammeter ${p.label} blew its 10 A fuse at ${fA(I)}. Use the amp clamp for heavy loads.`,'pop');}}break;
      case 'lamp':if(p.dmg)break;{const q=r.P/p.w;r.heat=hb(r.heat,q>1.6?(q-1.6)/1.2:-1,dt);
        if(q>1.6)mark(p,r.heat,`${p.label}: ${fW(r.P)} into a ${p.w} W lamp`);
        if(r.heat>=1){p.dmg=true;damage(p,`Lamp ${p.label} burned out — ${fW(r.P)} into a ${p.w} W, ${p.vr} V bulb.`,'pop');}}break;
      case 'led':if(p.dmg)break;{const q=I/0.03;r.heat=hb(r.heat,q>2?(q*q-4)/2:-1,dt);
        if(q>2)mark(p,r.heat,`${p.label}: ${fA(I)} through an LED`);
        if(r.heat>=1){p.dmg=true;damage(p,`LED ${p.label} popped at ${fA(I)}. An LED needs a series resistor — about 470 Ω on 12 V.`,'pop');}}break;
      case 'diode':if(p.dmg)break;{const q=I/3;r.heat=hb(r.heat,q>1?(q*q-1)/2:-1,dt);
        if(q>1)mark(p,r.heat,`${p.label}: ${fA(I)} through a 3 A diode`);
        if(r.heat>=1){p.dmg=true;damage(p,`Diode ${p.label} failed at ${fA(I)} — it is rated 3 A.`,'pop');}}break;
      case 'resistor':case 'rheo':if(p.dmg)break;{const pr=p.t==='rheo'?25:p.watt,q=r.P/pr;r.heat=hb(r.heat,q>1.5?(q-1.5)/4:-0.3,dt);
        if(q>1.5)mark(p,r.heat,`${p.label}: ${fW(r.P)} in a ${pr} W resistor`);
        if(r.heat>=1){p.dmg=true;damage(p,`Resistor ${p.label} burned open — ${fW(r.P)} in a ${pr} W part.`,'burn');}}break;
      case 'battery':{const out=-r.I;if(out>350)mark(p,2+out/1e4,`Dead short — ${fA(out)} out of ${p.label}`);}break;
      case 'ecu':{if(r.prot&&!r.act)r.prot=false;const Io=Math.abs(r.Iout||0);if(!r.prot&&Io>p.orate*1.5){r.prot=true;log(`${p.label} shut OUT off — ${fA(Io)} is more than its ${p.orate} A driver allows. Look for a short to ground on the output side.`,'warn');toast(`${p.label} output shut off: overcurrent`);sfx('click');}}break;
      case 'alt':r.out=-(r.Iout||0);break;
    }
  }
  for(const w of S.wires){if(w.burnt||w.nb)continue;const r=RT(w),I=Math.abs(r.I),amp=AWG[w.g].amp,q=I/amp;
    r.heat=hb(r.heat,q>1?(q*q-1)/30:-0.05,dt);
    if(q>1)mark(w,r.heat,`${w.label} (${w.g} AWG): ${fA(I)} on a ${amp} A wire`);
    if(r.heat>=0.5&&!r.smk){r.smk=true;log(`${w.label} (${w.g} AWG) is smoking — ${fA(I)} on wire rated ${amp} A.`,'warn');sfx('fizz');}

  }
  setBanner();
}

  const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||0.8;

const parts_=[];
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*7;parts_.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:0.35+Math.random()*0.45,max:0.8});}
  for(let i=0;i<6;i++)smoke(x+(Math.random()-.5),y+(Math.random()-.5));}
function smoke(x,y){parts_.push({k:'m',x,y,vx:(Math.random()-.5)*0.5,vy:-0.8-Math.random()*0.8,life:1.6+Math.random(),max:2.6,r:0.25});}
function stepParticles(dt){
  for(let i=parts_.length-1;i>=0;i--){const q=parts_[i];q.life-=dt;if(q.life<=0){parts_.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k==='s'){q.vy+=14*dt;}else{q.r+=dt*0.45;q.vx*=0.98;}}
  if(parts_.length>600)parts_.splice(0,parts_.length-600);
  const now=performance.now();
  for(const w of S.wires){const r=RT(w);const recent=w.burnt&&now-r.burnT<3500;
    if((r.heat>0.3&&!w.burnt)||recent){if(Math.random()<dt*(recent?6:3+r.heat*10)){const c=along(wpath(w),Math.random()*wlen(w));smoke(c.x,c.y);}}
    if(!w.burnt&&r.heat>0.75&&Math.random()<dt*8){const c=along(wpath(w),Math.random()*wlen(w));burst(c.x,c.y,3);}}
  for(const p of S.parts){const r=RT(p);const recent=(p.dmg||p.blown)&&now-r.burnT<3000;
    if(r.heat>0.35||recent){if(Math.random()<dt*(recent?5:4)){smoke(p.x+(Math.random()-.5)*.8,p.y-0.3);}}}
  if(worst&&worst.obj.t==='battery'&&Math.random()<dt*18){const tp=termPts(worst.obj)[0];burst(tp.x,tp.y,4);}
}

/* ---------- geometry helpers ---------- */
function along(pts,d){for(let i=0;i<pts.length-1;i++){const [x1,y1]=pts[i],[x2,y2]=pts[i+1],L=Math.abs(x2-x1)+Math.abs(y2-y1);
  if(d<=L||i===pts.length-2){const t=L?Math.min(1,d/L):0;return{x:x1+(x2-x1)*t,y:y1+(y2-y1)*t};}d-=L;}return{x:pts[0][0],y:pts[0][1]};}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=clamp(t,0,1);const x=x1+t*dx-px,y=y1+t*dy-py;return Math.hypot(x,y);}
function partAt(w){for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i],[lx,ly]=rot(w.x-p.x,w.y-p.y,(4-p.r)&3),b=T[p.t].box;
  if(lx>=b[0]-0.1&&lx<=b[2]+0.1&&ly>=b[1]-0.1&&ly<=b[3]+0.1)return p;}return null;}
function wireAt(w,tol){tol=tol||0.42;let best=null,bd=tol;for(const wr of S.wires){const p=wpath(wr);
  for(let i=0;i<2;i++){const d=segDist(w.x,w.y,p[i][0],p[i][1],p[i+1][0],p[i+1][1]);if(d<bd){bd=d;best=wr;}}}return best;}
const snap=w=>({x:Math.round(w.x),y:Math.round(w.y)});
function snapPref(w){let best=null,bd=0.8;const chk=(x,y)=>{const d=Math.hypot(w.x-x,w.y-y);if(d<bd){bd=d;best={x,y};}};for(const p of S.parts)for(const t of termPts(p))chk(t.x,t.y);for(const wr of S.wires){chk(wr.x1,wr.y1);chk(wr.x2,wr.y2);}return best||snap(w);}
const same=(a,b)=>a&&b&&a.x===b.x&&a.y===b.y;
function termDirAt(pt){for(const p of S.parts){const ts=termsOf(p);for(const [n,x,y] of ts){const [a,b]=rot(x,y,p.r);if(p.x+a===pt.x&&p.y+b===pt.y){const lx=x===0&&y===0?0:Math.sign(x)*(Math.abs(x)>=Math.abs(y)?1:0),ly=x===0&&y===0?1:Math.sign(y)*(Math.abs(y)>Math.abs(x)?1:0);const [dx]=rot(lx,ly,p.r);return Math.abs(dx)>0?'h':'v';}}}return null;}
function autoBend(a,b){const da=termDirAt(a);if(da)return da;const db=termDirAt(b);if(db)return db==='h'?'v':'h';return 'h';}
function describePt(pt){if(!pt)return '—';for(const p of S.parts)for(const t of termPts(p))if(t.x===pt.x&&t.y===pt.y){
  if(p.t==='ground')return 'ground';if(p.t==='battery')return `${p.label} ${t.n==='+'?'+':'−'} post`;
  if(p.t==='relay')return `${p.label} pin ${t.n}`;return `${p.label} ${t.n}`;}
  for(const w of S.wires)if((w.x1===pt.x&&w.y1===pt.y)||(w.x2===pt.x&&w.y2===pt.y))return `${w.label} end`;return 'board';}

  else if(p.t==='spdt'){p.pos=p.pos==='A'?'B':'A';sfx('click');}
  else if(p.t==='key'){p.pos=p.pos==='OFF'?'ACC':p.pos==='ACC'?'ON':'OFF';sfx('click');}
  else if(p.t==='pswitch'){p.act=!p.act;sfx('click');}
  else if(p.t==='drv'){p.on=!p.on;sfx('click');}
  else if(p.t==='alt'){p.run=!p.run;sfx('click');log(p.run?`Engine started — ${p.label} is turning.`:'Engine stopped.','ok');}
  else if(p.t==='breaker'&&p.tripped){p.tripped=false;r.heat=0;log(`Breaker ${p.label} reset.`,'ok');sfx('click');}
  else return false;
  save();return true;}
function repairAll(){let n=0;for(const p of S.parts){if(p.blown||p.dmg||p.tripped)n++;p.blown=false;p.dmg=false;p.tripped=false;RT(p).heat=0;}for(const w of S.wires){if(w.burnt)n++;w.burnt=false;RT(w).heat=0;}
  commit();log(n?`Replaced ${n} damaged part${n>1?'s':''}. If the fault is still there, it will happen again.`:'Nothing was damaged.','ok');toast(n?`Replaced ${n} part${n>1?'s':''}`:'Nothing to repair');renderPanel();}

/* ---------- pointer handling ---------- */
const ptrs=new Map();let gest=null,pinch=null;
function midOf(){const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2,d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)};}
function releaseGest(){if(!gest)return;if(gest.type==='part'){clearTimeout(gest.lp);const r=RT(gest.p);if(gest.p.t==='button')r.pressed=false;if(gest.crank)gest.p.pos='ON';}gest=null;}
cv.addEventListener('pointerdown',e=>{unlockAudio();try{cv.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){releaseGest();const m=midOf(),r=cv.getBoundingClientRect();pinch={d:m.d,s:view.s,wx:(m.x-r.left-view.ox)/(view.s*GRID),wy:(m.y-r.top-view.oy)/(view.s*GRID)};return;}
  if(ptrs.size>2)return;
  const w=toWorld(e.clientX,e.clientY);hover=w;
  if(M.on&&!e.button){let bw=null,bd=30;for(const wh of activeProbes()){const t=probeScreen(wh);if(!t)continue;const d=Math.hypot(w.sx-t.x,w.sy-(t.y-14));if(d<bd){bd=d;bw=wh;}}if(bw){PD={which:bw,x:w.sx,y:w.sy};gest={type:'probe',which:bw,sx:w.sx,sy:w.sy,moved:true};if(bw==='clamp')M.wire=null;else M[bw]=null;return;}}
  if(armed){gest={type:'place',sx:w.sx,sy:w.sy,moved:false};return;}
  if(e.button===1||e.button===2){gest={type:'pan',sx:w.sx,sy:w.sy,ox:view.ox,oy:view.oy,moved:true};return;}
  if(tool==='select'){
    const so=selObj();
    if(so&&!so.t&&!jobLocked()){for(const e2 of [1,2]){const x=e2===1?so.x1:so.x2,y=e2===1?so.y1:so.y2;if(Math.hypot(w.x-x,w.y-y)<0.55){gest={type:'wend',w:so,e:e2,sx:w.sx,sy:w.sy,moved:false};return;}}}
    const p=partAt(w);
    if(p){gest={type:'part',p,w0:w,x0:p.x,y0:p.y,att:attachedEnds(p),sx:w.sx,sy:w.sy,moved:false};
      if(p.t==='button'&&!p.dmg){RT(p).pressed=true;sfx('click');}
      if(p.t==='key'&&p.pos==='ON'){const g=gest;g.lp=setTimeout(()=>{if(gest===g&&!g.moved){g.crank=true;p.pos='START';sfx('click');}},350);}
      return;}
    const wr=wireAt(w);if(wr){gest={type:'wire',w:wr,sx:w.sx,sy:w.sy,ox:view.ox,oy:view.oy,moved:false};return;}
    gest={type:'pan',sx:w.sx,sy:w.sy,ox:view.ox,oy:view.oy,moved:false};return;}
  if(tool==='wire'){const s=snapPref(w);gest={type:'wdraw',a:wireStart||s,two:!!wireStart,sx:w.sx,sy:w.sy,moved:false};wirePrev=s;return;}
  gest={type:'tap',sx:w.sx,sy:w.sy,ox:view.ox,oy:view.oy,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const w=toWorld(e.clientX,e.clientY);
  if(pinch&&ptrs.size>=2){const m=midOf(),r=cv.getBoundingClientRect();view.s=clamp(pinch.s*m.d/Math.max(1,pinch.d),0.18,3.2);view.ox=(m.x-r.left)-pinch.wx*view.s*GRID;view.oy=(m.y-r.top)-pinch.wy*view.s*GRID;return;}
  hover=w;
  if(!gest){if(tool==='wire'&&wireStart)wirePrev=snapPref(w);return;}
  if(!gest.moved&&Math.hypot(w.sx-gest.sx,w.sy-gest.sy)>7){gest.moved=true;
    if(gest.type==='part'){clearTimeout(gest.lp);const r=RT(gest.p);if(gest.p.t==='button')r.pressed=false;if(gest.crank){gest.p.pos='ON';gest.crank=false;}}}
  if(!gest.moved)return;
  switch(gest.type){
    case 'probe':if(PD){PD.x=w.sx;PD.y=w.sy;}break;
    case 'part':{if(jobLocked())break;const p=gest.p,dx=Math.round(w.x-gest.w0.x),dy=Math.round(w.y-gest.w0.y);if(p.x!==gest.x0+dx||p.y!==gest.y0+dy){p.x=gest.x0+dx;p.y=gest.y0+dy;for(const a of gest.att){if(a.e===1){a.w.x1=a.x+dx;a.w.y1=a.y+dy;}else{a.w.x2=a.x+dx;a.w.y2=a.y+dy;}}}}break;
    case 'wend':{const s=snap(w);if(gest.e===1){gest.w.x1=s.x;gest.w.y1=s.y;}else{gest.w.x2=s.x;gest.w.y2=s.y;}}break;
    case 'wdraw':wirePrev=snapPref(w);break;
    case 'pan':case 'tap':case 'wire':if(gest.ox!==undefined){view.ox=gest.ox+(w.sx-gest.sx);view.oy=gest.oy+(w.sy-gest.sy);}break;
  }
});
function endPtr(e,cancel){ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;gest=null;return;}
  if(!gest)return;const g=gest;gest=null;const w=toWorld(e.clientX,e.clientY);
  switch(g.type){
    case 'probe':{PD=null;if(cancel)break;if(g.which==='clamp'){const wr=wireAt(w,0.7);if(wr){M.wire=wr.id;sfx('click');countTest();}}else{const pt=probeDrop(w);if(pt){M[g.which]=pt;sfx('click');countTest();}}}break;
    case 'place':if(!cancel)placeArmed(snap(w));break;
    case 'part':{clearTimeout(g.lp);const p=g.p,r=RT(p);if(p.t==='button')r.pressed=false;if(g.crank){p.pos='ON';save();}
      if(cancel)break;
      if(!g.moved&&S.job&&S.job.state==='diag'){pickDiag(p);break;}
      if(g.moved){if(p.x!==g.x0||p.y!==g.y0)commit();break;}
      const wasSel=sel===p.id;sel=p.id;
      if(!g.crank&&operate(p)){if(!wasSel)panelMin=true;}else if(!g.crank)panelMin=false;
      renderPanel();if(!panelMin)ensureVisible(p);}break;
    case 'wend':if(g.moved){if(g.w.x1===g.w.x2&&g.w.y1===g.w.y2){delObj(g.w);toast('Zero-length wire removed.');}else commit();}break;
    case 'wire':if(!g.moved&&!cancel&&S.job&&S.job.state==='diag'){pickDiag(g.w);break;}
      if(!g.moved&&!cancel){sel=g.w.id;panelMin=false;renderPanel();ensureVisible(g.w);}break;
    case 'pan':if(!g.moved&&!cancel){if(sel){sel=null;renderPanel();}else if(!isDesk()&&panelMode!=='auto'){panelMode='auto';renderPanel();}}break;
    case 'wdraw':{if(cancel){break;}const b=snapPref(w);
      if(!same(b,g.a)){addWire(g.a,b);wireStart=null;}
      else if(g.two){wireStart=null;}
      else wireStart=g.a;
      wirePrev=b;syncHint();}break;
    case 'tap':if(g.moved||cancel)break;
      if(tool==='delete'){const p=partAt(w)||wireAt(w);if(p){delObj(p);toast(`Removed ${p.label}`);sfx('click');}}
      else if(tool==='meter')meterTap(w);
      break;
  }
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));

/* ---------- meter ---------- */
function probePoint(w){const s=snap(w);if(sim.idx.has(s.x+','+s.y)&&Math.hypot(w.x-s.x,w.y-s.y)<0.6)return s;
  const wr=wireAt(w);if(wr){const a={x:wr.x1,y:wr.y1},b={x:wr.x2,y:wr.y2};return Math.hypot(w.x-a.x,w.y-a.y)<Math.hypot(w.x-b.x,w.y-b.y)?a:b;}
  const p=partAt(w);if(p){let best=null,bd=1e9;for(const t of termPts(p)){const d=Math.hypot(w.x-t.x,w.y-t.y);if(d<bd){bd=d;best={x:t.x,y:t.y};}}return best;}return null;}
function countTest(){if(jobLocked()){S.job.tests++;if(!sel)renderPanel();}}
function meterTap(w){if(M.mode==='A'){const wr=wireAt(w,0.6);if(wr){M.wire=wr.id;sfx('click');countTest();}else toast('The clamp goes around a wire. Tap a wire.');return;}
  const pt=probePoint(w);if(!pt){toast('Tap a terminal, splice or wire end.');return;}
  if(M.mode==='TL'){M.tl=pt;sfx('click');countTest();return;}
  if(M.next==='red'){M.red=pt;M.next='black';}else{M.black=pt;M.next='red';}sfx('click');countTest();}
function setMeterMode(m){M.mode=m;document.querySelectorAll('[data-mm]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mm===m)));syncHint();}
function updateMeter(){const box=$('#meter');const show=M.on;box.hidden=!show;if(!show)return;
  let val='0.00',unit='V',note='',lt=0;
  if(M.mode==='V'){if(!M.red){val='-.--';note='Drag the red lead onto a connection. Leave the black lead off and it reads to ground.';}
    else{const v=ptV(M.red)-(M.black?ptV(M.black):0);val=isFinite(v)?(Math.abs(v)<0.005?0:v).toFixed(2):'-.--';note=`Red: ${describePt(M.red)} · Black: ${M.black?describePt(M.black):'chassis ground'}`;}}
  else if(M.mode==='R'){unit='Ω';const live=S.power&&S.parts.some(p=>p.t==='battery');
    if(live){val='----';note='Turn power off before reading ohms — a live circuit gives false readings.';}
    else if(!M.red){val='-.--';note='Drag the red and black leads onto the two points.';}
    else{const r=ohmsBetween(M.red,M.black);if(!isFinite(r)||r>2e7){val='OL';note='Open circuit — no path between the leads.';}else{const s=fR(r).split(' ');val=s[0];unit=s[1];note=`Red: ${describePt(M.red)} · Black: ${M.black?describePt(M.black):'chassis ground'}`;}}}
  else if(M.mode==='TL'){unit='';const bp=S.parts.find(p=>p.t==='battery');const ref=M.black?ptV(M.black):M.clip==='gnd'?0:(bp?ptV(termPts(bp)[0]):0),cw=M.black?describePt(M.black):M.clip==='gnd'?'ground':'battery +';
    if(!M.red){val='—';note=`Clip is on ${cw}. Drag the TL probe onto a connection.`;}
    else{const v=Math.abs(ptV(M.red)-ref);lt=v/Math.max(6,vmax);val=lt>0.75?'BRIGHT':lt>0.3?'DIM':lt>0.08?'FAINT':'OFF';note=`Probe on ${describePt(M.red)} · clip on ${cw}`;}}
  else{unit='A';const w=M.wire?byId(M.wire):null;if(!w){val='-.--';note='Drag the clamp onto a wire.';}else{const I=Math.abs(RT(w).I);val=I<10?I.toFixed(2):I<100?I.toFixed(1):I.toFixed(0);note=`Clamped on ${w.label} (${w.g} AWG, rated ${AWG[w.g].amp} A)`;}}
  $('#mVal').textContent=val;$('#mUnit').textContent=unit;$('#mNote').textContent=note;$('#lcd').style.background=M.mode==='TL'&&lt>0.08?mix('#B7C4A0','#FFD45C',Math.min(1,lt)):'';
  const mc=$('#mClip');mc.hidden=M.mode!=='TL'||!!M.black;mc.textContent='Clip: '+(M.clip==='gnd'?'ground':'battery +');}
$('#mClip').addEventListener('click',()=>{M.clip=M.clip==='gnd'?'bat':'gnd';sfx('click');});

  const tip={none:'Make a real fault here, then find it with the meter.',open:'No current gets through. Voltage is there up to the break and gone after it.',hr:'Current still flows but the load is weak. Find it with a voltage drop test while the circuit is on.',

function setFault(o,k,v){if(k==='fk'){if(v==='none'){delete o.hf;}else{const old=o.hf||{};o.hf={k:v,r:FDEF[v]!=null?(old.k===v?old.r:FDEF[v]):0,to:v==='touch'?(old.to||''):undefined};}if(INT[o.id])delete INT[o.id];return true;}
  if(!o.hf)return false;if(k==='fr'){const r=parseFloat(v);if(isFinite(r)&&r>0)o.hf.r=r;return true;}if(k==='fto'){o.hf.to=v;return true;}return false;}
function setProp(k,v,live){const o=selObj();if(!o)return false;
  if(k==='fk'||k==='fr'||k==='fto'){if(jobLocked())return false;const ok=setFault(o,k,v);if(ok&&(k==='fk'))log(v==='none'?`Removed the fault on ${o.label}.`:`Planted a fault on ${o.label}: ${FK[v].toLowerCase()}.`,'warn');return ok;}
  if(jobLocked()&&!['on','pos','act','run','tc','pct','unplug','tlf'].includes(k))return false;
  if(k==='label'){v=String(v).trim().slice(0,12);if(!v)return false;o.label=v;return true;}
  if(k==='on'||k==='nc'||k==='act'||k==='run'||k==='led'||k==='unplug'||k==='tlf'||k==='pulled')v=v===true||v==='true';
  else if(NUMK.has(k)){v=parseFloat(v);if(!isFinite(v))return false;
    const lim={ohms:[0.01,1e7],tc:[-40,150],pos:[0,100],v:[0.5,60],ri:[0.001,2],rw:[0.01,10000],ohm:[0.1,1e7],max:[1,1e5],pct:[0,100],a:[0.1,200]}[k];if(lim)v=clamp(v,lim[0],lim[1]);}
  if(!o.t){if(k==='g'&&AWG[v])o.g=v;else if(k==='c'&&WCOL[v])o.c=v;else if(k==='bend')o.bend=v==='v'?'v':'h';return true;}
  if(o.t==='relay'&&k==='pins'){o.pins=v;}
  else if(o.t==='motor'&&k==='kind'){o.kind=v;if(MOTORS[v].r)o.rw=MOTORS[v].r;}
  else if(o.t==='motor'&&k==='rw'){o.rw=v;o.kind='custom';}
  else o[k]=v;
  return true;}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){if(setProp(b.dataset.set,b.dataset.v)){commit();renderPanel();}return;}
  const a=b.dataset.act,o=selObj();if(!a)return;
  switch(a){
    case 'close':sel=null;panelMode='auto';renderPanel();break;
    case 'min':panelMin=!panelMin;panel.classList.toggle('min',panelMin);break;
    case 'rotate':if(o&&o.t){rotatePart(o);}break;
    case 'dup':if(o&&o.t){const c=JSON.parse(JSON.stringify(o));c.id='p'+(++S.seq);c.x+=2;c.y+=3;c.label=nextLabel(c.t);c.blown=false;c.dmg=false;c.tripped=false;S.parts.push(c);sel=c.id;commit();renderPanel();}break;

    case 'fhide':S.hideF=!S.hideF;save();renderPanel();break;
    case 'fclear':for(const x of [...S.parts,...S.wires])delete x.hf;for(const k in INT)delete INT[k];commit();log('Removed all planted faults.','ok');renderPanel();break;

    case 'school':sel=null;panelMode='school';panelMin=false;renderPanel();break;
    case 'lstart':startLesson(b.dataset.id);break;
    case 'lq':answerQ(+b.dataset.k);break;
    case 'lrestart':startLesson(S.lesson.id);break;
    case 'lskip':skipStep();break;
    case 'lquit':quitLesson();break;
    case 'lnext':{const i=LES.findIndex(l=>l.id===S.lesson.id);quitLesson();if(i>=0&&LES[i+1])startLesson(LES[i+1].id);else{panelMode='school';renderPanel();}}break;
    case 'sheet':{const v=$('#sheetPick').value;loadSheet(v);}break;
    case 'sjob':{const v=$('#sheetPick').value;startSheetJob(v);}break;
    case 'rsjob':{let ok=false;for(let i=0;i<6&&!ok;i++)ok=startSheetJob(null);}break;
    case 'jquit':endJob();break;
    case 'jfound':S.job.state='diag';S.job.msg='';save();renderPanel();syncHint();if(!isDesk()){panelMin=true;panel.classList.add('min');}break;
    case 'jcancel':S.job.state='open';S.job.pick=null;save();renderPanel();syncHint();break;
    case 'jgrade':grade(b.dataset.k);break;
    case 'jgive':giveUp();break;
    case 'jrep':if(o){o.blown=false;o.tripped=false;RT(o).heat=0;save();sfx('click');renderPanel();}break;
    case 'jtl':if(o){o.tlf=!o.tlf;if(o.tlf){o.blown=false;o.tripped=false;}RT(o).heat=0;countTest();save();sfx('click');renderPanel();}break;

    case 'jwig':if(o){wiggle(o);countTest();}break;
    case 'copy':{const t=$('#exportTxt');const done=()=>toast('Circuit copied');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Selected — copy it from here');});}catch(_){t.select();toast('Selected — copy it from here');}}break;
    case 'import':{try{const o2=JSON.parse($('#importTxt').value);if(!validState(o2))throw 0;loadState(o2);RTm.clear();sel=null;commit();fit();syncPower();log('Opened a pasted circuit.','ok');panelMode='auto';renderPanel();}catch(_){toast('That text is not a Circuit Bay circuit. Paste the whole thing, starting with {');}}break;
  }});

  {t:'Turn the <b>Meter</b> on, set to <b>DC V</b>, and make sure <b>S1</b> is ON.',chk:()=>mm('V')&&PT('S1').on,ok:'A voltage drop test only works with current flowing, so the circuit must be on.'},
  {t:'Put the <b>red lead on BAT1 +</b> and the <b>black lead on L1 in</b>.',chk:()=>mm('V')&&PT('S1').on&&leads(LP('BAT1','+'),LP('L1','in')),ok:'This shows all the voltage lost between the battery and the lamp. On a good circuit it is under about 0.5 V.'},
  {enter:()=>plant('W3',{k:'hr',r:0.6}),t:'I added corrosion somewhere on the power side and the lamp went dim. Read the same two points again.',chk:()=>mm('V')&&PT('S1').on&&leads(LP('BAT1','+'),LP('L1','in')),ok:'Much more is lost before the lamp now. That missing push is why it is dim.'},
  {t:'Narrow it down. Measure across one piece at a time (fuse, each wire, switch). Stop with the leads on <b>both ends of the piece with the big drop</b>.',chk:()=>mm('V')&&PT('S1').on&&across(...WE('W3')),ok:'The drop is across W3. A good wire drops close to 0 V, so the corrosion is in W3 or its terminals. Splitting the circuit this way is faster than taking it apart.'}]},
 {id:'vdgnd',name:'Voltage drop: ground side',sub:'Bad grounds hide here',ex:'headlight',steps:[
  {t:'Turn the <b>Meter</b> on, set to <b>DC V</b>, and make sure <b>S1</b> is ON.',chk:()=>mm('V')&&PT('S1').on,ok:'Grounds carry the full load current back to the battery, so they get the same test.'},
  {t:'Put the <b>red lead on L1 out</b> and the <b>black lead right on BAT1 −</b>.',chk:()=>mm('V')&&PT('S1').on&&leads(LP('L1','out'),LP('BAT1','-')),ok:'This is the whole ground path. It should be under about 0.2 V.'},
  {enter:()=>plant('W5',{k:'hr',r:0.6}),t:'I loosened a ground. Read the same two points again.',chk:()=>mm('V')&&PT('S1').on&&leads(LP('L1','out'),LP('BAT1','-')),ok:'Lots of voltage is now lost on the way back. The lamp is dim, and its ground side no longer reads near 0 V.'},
  {t:'Find it: put the leads on <b>both ends of the piece with the drop</b>.',chk:()=>mm('V')&&PT('S1').on&&across(...WE('W5')),ok:'W5 and its ground connection. On a truck, clean and tighten the ground stud, then test again with the circuit on.'}]},
 {id:'ohms',name:'Ohms and continuity',sub:'Power off, then check wires and parts',ex:'headlight',steps:[
  {t:'Tap the <b>Power</b> button at the top to disconnect the battery. Never read ohms on a live circuit.',chk:()=>!S.power,ok:'Battery disconnected.'},
  {t:'Turn the <b>Meter</b> on and set it to <b>Ω</b>.',chk:()=>mm('R')&&!S.power,ok:'In Ω mode the meter sends its own tiny current through whatever is between the leads.'},
  {t:'Check wire <b>W4</b> end to end: one lead on each end.',chk:()=>mm('R')&&!S.power&&across(...WE('W4')),ok:'Near 0 Ω means the wire is continuous. A good wire reads well under 1 Ω.'},
  {t:'Measure the lamp: leads on <b>L1 in</b> and <b>L1 out</b>.',chk:()=>mm('R')&&!S.power&&across(LP('L1','in'),LP('L1','out')),ok:'A few ohms through the filament. A burned-out bulb reads OL.'},
  {enter:()=>plant('W4',{k:'open'}),t:'I broke W4 inside its insulation. Check it end to end again.',chk:()=>mm('R')&&!S.power&&across(...WE('W4')),ok:'OL means open: no path at all. A wire can look fine outside and still read OL.'},
  {t:'Why must the power be off for an ohms test?',q:['Circuit voltage mixes with the meter\'s own test current and gives a false reading','Ohms only work on 24 V trucks','It makes the reading faster'],a:0,ok:'Right. And with power off, also isolate the part (unplug it) so other paths don\'t add to the reading.'}]},
 {id:'amps',name:'Amp clamp',sub:'Current draw without opening the circuit',ex:'headlight',steps:[
  {t:'Turn the <b>Meter</b> on and set it to <b>Amps</b>.',chk:()=>mm('A'),ok:'The clamp reads the magnetic field around a wire, so you never cut or unplug anything.'},
  {t:'Turn <b>S1</b> ON and drag the <b>clamp</b> onto wire <b>W4</b>, the one feeding the lamp.',chk:()=>mm('A')&&PT('S1').on&&M.wire===WB('W4').id,ok:'About 4.7 A. Check it against the bulb: 55 W ÷ 12 V ≈ 4.6 A, a little more at 12.6 V. Much more means a short or a stuck motor; much less means high resistance.'},
  {t:'Turn <b>S1</b> OFF and watch the clamp.',chk:()=>mm('A')&&!PT('S1').on&&M.wire===WB('W4').id,ok:'It drops to 0 A. Most truck loads would blow a meter\'s 10 A fuse, which is why techs reach for a clamp.'}]},
 {id:'para',name:'Parasitic draw',sub:'What is draining the batteries overnight',ex:'ecu',steps:[
  {t:'Turn the <b>Meter</b> on and set it to <b>Amps</b>. The door is closed and the truck is parked.',chk:()=>mm('A')&&!PT('DOOR').act,ok:'Ready.'},
  {t:'Clamp the battery feed wire <b>W2</b>.',chk:()=>mm('A')&&M.wire===WB('W2').id&&!PT('DOOR').act,ok:'About 210 mA with everything off. A parked truck should draw only a few dozen milliamps, so something is staying awake.'},
  {t:'Find the circuit: tap fuse <b>F1</b>, set it to <b>Pulled</b>, and watch the clamp.',chk:()=>mm('A')&&M.wire===WB('W2').id&&PT('F1').pulled,ok:'The draw went to 0, so the drain is on F1\'s circuit. On a truck you pull fuses one at a time until the draw drops. Give the modules several minutes to go to sleep before you start.'}]},
 {id:'tl',name:'Test light',sub:'Quick power and ground checks',ex:'headlight',steps:[
  {t:'Turn the <b>Meter</b> on and choose <b>Light</b>. The clip starts on ground.',chk:()=>mm('TL')&&M.clip==='gnd'&&!M.black,ok:'A test light is a bulb between the probe and the clip. It lights when there is a voltage difference that can push real current.'},
  {t:'Turn <b>S1</b> ON and touch the probe (red lead) to <b>L1 in</b>.',chk:()=>mm('TL')&&PT('S1').on&&red(LP('L1','in'))&&M.clip==='gnd'&&!M.black,ok:'Bright: there is power there.'},
  {t:'Now touch <b>L1 out</b>.',chk:()=>mm('TL')&&red(LP('L1','out'))&&M.clip==='gnd'&&!M.black,ok:'Off: that point is at ground, as it should be.'},
  {t:'Tap the <b>Clip</b> button on the meter to move the clip to <b>battery +</b>, then touch <b>L1 out</b> again.',chk:()=>mm('TL')&&red(LP('L1','out'))&&M.clip==='bat'&&!M.black,ok:'Bright now. With the clip on battery +, a lit test light proves a good ground. A test light draws real current (1 to 2 A), so it can show a weak connection a meter misses. Never probe module or sensor circuits with one: that current can damage a module.'}]},
 {id:'relay',name:'Testing a relay',sub:'Coil, signal, contacts',ex:'horn',steps:[
  {t:'Tap <b>Power</b> at the top to disconnect the battery, then set the <b>Meter</b> to <b>Ω</b>.',chk:()=>mm('R')&&!S.power,ok:'Ready to measure the coil.'},
  {t:'Measure the coil: leads on <b>K1 pin 86</b> and <b>K1 pin 85</b>.',chk:()=>mm('R')&&!S.power&&across(LP('K1','86'),LP('K1','85')),ok:'About 80 Ω is a good 12 V coil. OL is an open coil; near 0 Ω is a shorted coil that can blow its fuse.'},
  {t:'Reconnect <b>Power</b>, set the meter to <b>DC V</b>, black lead on ground and red lead on <b>K1 pin 30</b>.',chk:()=>mm('V')&&S.power&&leads(LP('K1','30'),'gnd'),ok:'Battery voltage on 30: the relay has its power feed.'},
  {t:'Move the red lead to <b>pin 86</b>, then <b>press and hold the HORN button</b>.',chk:()=>mm('V')&&S.power&&leads(LP('K1','86'),'gnd')&&RT(PT('HORN')).pressed,ok:'Voltage on 86 only while you press: the button sends the signal. Pin 85 is the coil\'s ground.'},
  {t:'Move the red lead to <b>pin 87</b> and hold the <b>HORN</b> button again.',chk:()=>mm('V')&&S.power&&leads(LP('K1','87'),'gnd')&&RT(PT('HORN')).pressed,ok:'Voltage on 87 means the contacts closed and fed the horn.'},
  {enter:()=>plant('K1',{k:'stuckopen'}),t:'Now the horn is dead but you can hear the relay click. Check <b>pin 87</b> again while holding <b>HORN</b>.',chk:()=>mm('V')&&S.power&&leads(LP('K1','87'),'gnd')&&RT(PT('HORN')).pressed,ok:'0 V on 87, even though 30 has power and the coil clicks.'},
  {t:'What is wrong?',q:['The coil is open','The contacts are not closing','The horn ground is bad'],a:1,ok:'The coil works (it clicks) and 30 has power, but 87 stays dead: burnt or stuck contacts. Replace the relay.'}]}
];
function lesDone(){try{return JSON.parse(localStorage.getItem(KEY+':school')||'{}');}catch(e){return{};}}
function startLesson(id){const L=LES.find(l=>l.id===id);if(!L)return;if(S.job)endJob();loadExample(L.ex,true);
  M.red=M.black=M.wire=M.tl=null;M.next='red';M.clip='gnd';PD=null;S.lesson={id,i:0,reads:[],msg:''};
  const st=L.steps[0];if(st.enter)st.enter();sel=null;panelMode='auto';panelMin=false;save();renderPanel();syncHint();log(`Meter school: ${L.name}.`,'ok');}
function curLesson(){return S.lesson&&LES.find(l=>l.id===S.lesson.id);}
function readNow(){if(!M.on)return '';if(M.mode==='A'?!M.wire:!M.red)return '';const v=$('#mVal').textContent,u=$('#mUnit').textContent;return (v==='OL'||v==='----'?v:v+(u?' '+u:'')).trim();}
function advance(){const L=curLesson(),s=S.lesson;if(!L)return;if(s.reads[s.i]==null)s.reads[s.i]=readNow();s.i++;s.msg='';sfx('click');
  if(s.i>=L.steps.length){const d=lesDone();d[L.id]=1;try{localStorage.setItem(KEY+':school',JSON.stringify(d));}catch(e){}log(`Meter school: finished “${L.name}”.`,'ok');}
  else{const st=L.steps[s.i];if(st.enter)st.enter();}save();if(!sel)renderPanel();}
function lessonTick(){const L=curLesson();if(!L)return;const s=S.lesson;if(s.i>=L.steps.length)return;const st=L.steps[s.i];if(st.q||!st.chk)return;let ok=false;try{ok=st.chk();}catch(e){}if(ok)advance();}
function answerQ(k){const L=curLesson();if(!L)return;const st=L.steps[S.lesson.i];if(!st||!st.q)return;if(k===st.a){S.lesson.reads[S.lesson.i]=st.q[k];advance();}else{S.lesson.msg='Not quite. Look at your readings again.';renderPanel();}}
function skipStep(){const L=curLesson();if(!L)return;const st=L.steps[S.lesson.i];if(st&&st.q){S.lesson.reads[S.lesson.i]=st.q[st.a];}advance();}
function quitLesson(silent){clearHF();for(const p of S.parts)p.pulled=false;S.lesson=null;save();if(!silent){panelMode='school';renderPanel();}syncHint();}
function schoolHTML(){const d=lesDone(),n=LES.filter(l=>d[l.id]).length;
  return `<div class="phead"><div class="ttl"><span class="tag">Meter school · ${n} of ${LES.length} done</span><h2>Meter tests</h2></div><button type="button" class="pbtn pclose" data-act="close" aria-label="Close">×</button></div>
  <div class="pbody"><p class="note">Each lesson loads a circuit and tells you where to drag the leads. The step ticks off by itself when the leads are in the right place.</p><div class="exlist">${LES.map((l,i)=>`<button type="button" class="exb" data-act="lstart" data-id="${l.id}"><b>${d[l.id]?'✓ ':''}${i+1}. ${l.name}</b><span>${l.sub} · ${l.steps.length} steps</span></button>`).join('')}</div></div>`;}
function lessonHTML(){const L=curLesson(),s=S.lesson;if(!L)return logHTML();const n=L.steps.length,done=s.i>=n,st=L.steps[Math.min(s.i,n-1)];
  const past=L.steps.slice(0,s.i).map((x,i)=>`<li class="ok"><span>${x.q?'<b>'+esc(s.reads[i]||'')+'</b>':x.t}</span>${s.reads[i]&&!x.q?`<span class="rd">You read ${esc(s.reads[i])}</span>`:''}<span class="lok">${x.ok}</span></li>`).join('');
  const cur=done?`<p class="cust">Lesson complete.</p>`:`<p class="cust">${st.t}</p>`;
  const q=!done&&st.q?`<div class="exlist">${st.q.map((o,k)=>`<button type="button" class="exb" data-act="lq" data-k="${k}"><b>${esc(o)}</b></button>`).join('')}</div>${s.msg?`<p class="status">${esc(s.msg)}</p>`:''}`:'';
  const minB=closeB.replace(/<button[^>]*data-act="close"[\s\S]*$/,'');
  return `<div class="phead"><div class="ttl"><span class="tag">Meter school · ${esc(L.name)} · ${done?'done':'step '+(s.i+1)+' of '+n}</span>${cur}</div>${minB}</div>
  <div class="pbody">${q}${done?`<div class="result"><span class="tag">Finished</span><b class="big">${esc(L.name)}</b><p>${L.steps[n-1].ok}</p></div>`:''}
  ${past?`<ol class="tasks">${past}</ol>`:''}
  <div class="acts">${done?'<button type="button" class="btn primary" data-act="lnext">Next lesson</button>':`<button type="button" class="btn" data-act="lskip">Skip step</button>`}<button type="button" class="btn" data-act="lrestart">Restart</button><button type="button" class="btn" data-act="lquit">All lessons</button></div></div>`;}

/* ---------- loop ---------- */
let last=performance.now(),liveT=0;
function frame(t){const dt=Math.min(0.05,Math.max(0.001,(t-last)/1000));last=t;
  try{stepInt(dt);solve();heatTick(dt);stepParticles(dt);draw(dt);drawLeads();}catch(err){console.error(err);}
  liveT+=dt;if(liveT>0.15){liveT=0;updateLive();updateMeter();lessonTick();}
  requestAnimationFrame(frame);}

/* ---------- boot ---------- */
readColors();
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>{readColors();redrawIcons();});
new MutationObserver(()=>{readColors();redrawIcons();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{const wd=JSON.parse(localStorage.getItem(KEY+':wdef')||'null');if(wd&&AWG[wd.g]&&WCOL[wd.c]){WDEF.g=wd.g;WDEF.c=wd.c;gSel.value=wd.g;cSel.value=wd.c;}}catch(e){}
let restored=false;try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(validState(s)&&s.parts.length){loadState(s);restored=true;}}catch(e){}
if(!restored)build(EX[0].fn);
try{if(localStorage.getItem(KEY+':real')==='0'){realView=false;$('#vReal').setAttribute('aria-pressed','false');}}catch(e){}
hist=[snapState()];hi=0;syncUndo();syncPower();buildPalette();syncJob();syncSheetBar();
resize();fit();
let lastDesk=isDesk();
const toolsEl=$('#tools');new ResizeObserver(()=>{document.documentElement.style.setProperty('--tools-h',toolsEl.offsetHeight+'px');}).observe(toolsEl);
new ResizeObserver(()=>{const fresh=!W;resize();if(fresh)fit();const d=isDesk();if(d!==lastDesk){lastDesk=d;renderPanel();}}).observe(stage);
setTool('select');
log(restored?'Your last board is back.':'Loaded “Headlight circuit”. Tap S1 to flip the switch.','ok');
renderPanel();
requestAnimationFrame(frame);
})();
</script>

</body></html>
